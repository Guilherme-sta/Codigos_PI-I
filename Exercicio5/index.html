<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src = "scripts.js" defer></script>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <h1>Botão de erro</h1>
    <button id="botaoErro">Mostrar Erro</button>
    <div id="mensagemErro1" class="oculto"></div>

    <h1>Exibir imput de texto</h1>
    <label for="caixadeTexto">Digite o texto:</label>
    <input type="text" id="caixaDeTexto"><br>
    <button id="botaoExibir">Exibir</button>
    <div id="mensagemErro2"></div>
    <div id="conteudo"></div>

    <h1>Cálculo de taxa de engajamento de postagem</h1>
    <label for="caixadeInteracoes">Número de interações:</label>
    <input type="text" id="caixadeInteracoes"><br>
    <label for="caixadeVisualizacoes">Número de visualizações:</label>
    <input type="text" id="caixadeVisualizacoes"><br>
    <button id="calcularTaxa">Cálculo de taxa</button>
    <div id="mensagemErro3"></div>
    <div id="taxaResultante"></div>
    
    <h1>Upload</h1>
    <input type="file" id="uploadImagem" accept="image/*"><br>
    <button id="botaoUpload">Upload</button>
    <div id="mensagemErro4"></div>
    <div id="resultadoUpload"></div>

    <h1>Upload com select</h1>
    <label>
        Selecione uma imagem:
        <select class="galeria" name="galeria">
            <option value="" selected disabled hidden>Selecione uma opção</option>
            <option value="Aria">Aria of Sorrow</option>
            <option value="Lament">Lament of Innocence</option>
            <option value="Symphony">Symphony of the Night</option>
        </select>
    </label>
    <div id="resultadoSelect"></div>

    <h1>Redes sociais favoritas</h1>
    <div id="redesSociais">
    <div>
        <input type="checkbox" id="facebook" name="redesSociais" value="Facebook">
        <label for="facebook">Facebook</label>
    </div>
    <div>
        <input type="checkbox" id="twitter" name="redesSociais" value="Twitter">
        <label for="twitter">Twitter</label>
    </div>
    <div>
        <input type="checkbox" id="instagram" name="redesSociais" value="Instagram">
        <label for="instagram">Instagram</label>
    </div>
    <div>
        <input type="checkbox" id="linkedin" name="redesSociais" value="LinkedIn">
        <label for="linkedin">LinkedIn</label>
    </div>
    <div>
        <input type="checkbox" id="tiktok" name="redesSociais" value="TikTok">
        <label for="tiktok">TikTok</label>
    </div>
    <button type="button" id="enviarBtn">Enviar Seleção</button>
    <div id="redesSelecionadas"></div>
    <div class="oculto" id="mensagemErro5"></div>
    </div>

    <h1>Hashtags em alta</h1>
    <div id="threading">
    <input type="text" id="inputHashtag" placeholder="Digite uma hashtag"><br>
    <button id="adicionarHashtag">Adicionar</button><br>
    <div id="mensagemErro6"></div>
    <p><strong>Assuntos que estão em alta</strong></p>
    <select id ="Hashtags" name="Hashtags" size="5"></select><br>
    <button id="removerHashtag">Remover</button>
    </div>

    <h1>Mover Ativos Financeiros entre Carteiras</h1>
    <div class="container">
        <div>
            <label for="ativosDisponiveis">Ativos Disponíveis:</label><br>
             <div id="mensagemErro7"></div>
            <select id="ativosDisponiveis" size="10" multiple>
                <option value="AAPL">Apple (AAPL)</option>
                <option value="GOOGL">Google (GOOGL)</option>
                <option value="AMZN">Amazon (AMZN)</option>
                <option value="MSFT">Microsoft (MSFT)</option>
                <option value="TSLA">Tesla (TSLA)</option>
                <option value="BRK.B">Berkshire Hathaway (BRK.B)</option>
                <option value="FB">Meta (FB)</option>
                <option value="V">Visa (V)</option>
                <option value="JNJ">Johnson & Johnson (JNJ)</option>
                <option value="WMT">Walmart (WMT)</option>
            </select>
        </div>
        <div class="buttons">
            <button id="moverParaDireitaBtn">Mover para a carteira de investimentos</button>
            <button id="moverparaEsquerdaBtn">Mover para a carteira de ativos disponíveis</button>
        </div>
        <div>
            <label for="carteiraInvestimentos">Carteira de Investimentos:</label><br>
            <div id="mensagemErro8"></div>
            <select id="carteiraInvestimentos" size="10" multiple></select>
        </div>
    </div>
  
</body>
</html>
